# Written by webcat init. Checks the live site the way the extension and the auditors do; a failure is a broken site.
name: WEBCAT verify
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: docker
    container:
      image: node:22
    steps:
      - uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @freedomofpress/webcat-cli@{{cli_version}}
      - run: webcat site check {{host}}
      - run: webcat audit {{host}}
